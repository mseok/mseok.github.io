#
# _data/scholar.json is regenerated by .github/workflows/scholar-sync.yml.
# New Scholar entries appear on the page automatically with Scholar's own
# fields; anything set here wins over Scholar's value.
#
# Fields: title, authors, venue, year, links (list of label/url),
#         short, summary, contribution, selected (order in "Selected"),
#         hidden (true keeps an entry off the page).

"3fE2CSJIrl8C":
  short: K-Fold
  title: Predicting conformational changes induced by biomolecular interactions
  authors: Yeongnam Bae, Jinheon Baek, Eugene Choi, …, Seokhyun Moon, …, Woo Youn Kim, Gyu Rie Lee, Byung-Ha Oh (33 authors)
  selected: 1
  summary: >-
    Biomolecular interactions reshape protein structures in ways that matter
    for signaling, regulation and drug action. K-Fold predicts a complex by
    modeling the structural transition from the unbound components to the
    assembled state, so that interaction-induced conformational changes are
    part of the prediction.
  contribution: >-
    I co-designed the diffusion bridge module and led its development,
    proposed its modeling approach and training and inference strategies,
    and analyzed the evaluation results.
  links:
    - label: Paper
      url: https://www.biorxiv.org/content/10.64898/2026.10.26.760299v1

