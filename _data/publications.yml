# Display overrides for Google Scholar entries, keyed by Scholar article id
# (the part after ":" in a Scholar `citation_for_view` link). The home page
# and the CV (publications.tex in mseok/AcademicCV) are both built from this
# file and _data/scholar.json.
#
# _data/scholar.json is refreshed weekly from Google Scholar. New Scholar
# entries appear automatically with Scholar's own fields; anything set here
# wins over Scholar's value.
#
# Fields: title, authors, venue, year, links (list of label/url),
#         short, summary, contribution, selected (order in "Selected"),
#         hidden (true keeps an entry off the page and the CV),
#         cv.venues (list of label/text/url for the CV), cv.note,
#         date ("YYYY-MM-DD"). Entries are ordered by year, then by the date
#         the title first became public (preprints included), newest first.
#         scripts/scholar_sync.py finds that date in Crossref and arXiv; set
#         date here only when the lookup cannot (OpenReview-only venues, titles
#         that arXiv search misses). Undated entries lead their year.
# In authors, "*" marks equal contribution and "†" a corresponding author,
# as stated by the publisher, the paper or the owner's CV.

"3fE2CSJIrl8C":
  short: K-Fold
  title: Predicting conformational changes induced by biomolecular interactions
  authors: Yeongnam Bae, Jinheon Baek, Eugene Choi, …, Hyeongwoo Kim†, …, Seokhyun Moon, …, Woo Youn Kim†, Gyu Rie Lee, Byung-Ha Oh
  selected: 1
  summary: >-
    Biomolecular interactions reshape protein structures in ways that matter
    for signaling, regulation and drug action. K-Fold predicts a complex by
    modeling the structural transition from the unbound components to the
    assembled state, so that interaction-induced conformational changes are
    part of the prediction.
  contribution: >-
    As one of the main developers of K-Fold, I co-designed the diffusion
    bridge module and led its development, proposed its modeling approach
    and training and inference strategies, and analyzed the evaluation
    results.
  links:
    - label: Paper
      url: https://www.biorxiv.org/content/10.64898/2026.10.26.760299v1
    - label: Code
      url: https://github.com/kaist-ai-bio/kfold
  cv:
    note: "K-Fold. One of the main developers: co-designed the diffusion bridge module and led its development."
    venues:
      - label: "[P2]"
        text: bioRxiv preprint
        url: https://www.biorxiv.org/content/10.64898/2026.10.26.760299v1

